name: CI & Test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_proot:
        description: "Bundle optional PRoot Ubuntu 24.04 arm64 rootfs into test APK"
        type: boolean
        default: false

jobs:
  dart-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test acp_client
        run: |
          cd packages/acp_client
          dart pub get
          dart analyze
          dart test
      - name: Test agy_remote
        run: |
          cd packages/agy_remote
          dart pub get
          dart analyze
          dart test

  android-test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze & test Flutter app
        run: |
          cd app
          flutter pub get
          flutter analyze
          flutter test
      - name: Optional PRoot Ubuntu 24.04 arm64 rootfs
        if: ${{ inputs.include_proot == true }}
        run: bash runtime/build-rootfs.sh arm64-v8a
      - name: Build Android arm64 test APK (Release AOT, fixed package & signing key, no GitHub Release)
        env:
          AGY_KEYSTORE_BASE64: ${{ secrets.AGY_KEYSTORE_BASE64 }}
          AGY_KEYSTORE_PASSWORD: ${{ secrets.AGY_KEYSTORE_PASSWORD }}
          AGY_KEY_ALIAS: ${{ secrets.AGY_KEY_ALIAS }}
          AGY_KEY_PASSWORD: ${{ secrets.AGY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNED_MODE="debug-ephemeral"
          if [ -n "${AGY_KEYSTORE_BASE64:-}" ]; then
            export AGY_KEYSTORE_PATH="$RUNNER_TEMP/agy-signing.jks"
            printf '%s' "$AGY_KEYSTORE_BASE64" | base64 -d > "$AGY_KEYSTORE_PATH"
            SIGNED_MODE="stable-ci-keystore"
          fi
          bash tooling/build-apk.sh --release --abi arm64
          cp app/build/app/outputs/flutter-apk/app-release.apk agy-go-arm64.apk
          SHA="$(sha256sum agy-go-arm64.apk | awk '{print $1}')"
          SIZE="$(du -h agy-go-arm64.apk | awk '{print $1}')"
          {
            echo "### Android arm64 Test APK (Not Released)"
            echo "- Application ID: \`io.github.kailian5922.agy_go\`"
            echo "- File: \`agy-go-arm64.apk\`"
            echo "- Signing: \`$SIGNED_MODE\`"
            echo "- Size: \`$SIZE\`"
            echo "- SHA-256: \`$SHA\`"
            echo "- PRoot Ubuntu bundled: \`${{ inputs.include_proot == true }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agy-go-arm64-test-apk
          path: agy-go-arm64.apk
          retention-days: 14
          if-no-files-found: error
