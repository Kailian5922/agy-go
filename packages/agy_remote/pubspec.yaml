name: agy_remote
description: Transports for AGY Go — loopback TCP bridge to the on-device Android runtime and SSH exec transport to remote `agy acp`.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  acp_client:
    path: ../acp_client
  crypto: ^3.0.7
  dartssh2: ^2.11.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
